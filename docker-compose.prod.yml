name: unicloud AI platform

services:
  postgres:
    image: ccr.ccs.tencentyun.com/buildingai/postgres:17.6
    container_name: ai-db-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-api_platform_pro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-api_platform_pro}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ai-network

  redis:
    image: ccr.ccs.tencentyun.com/buildingai/redis:8.2.2
    container_name: unicloud-ai-redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass \"$REDIS_PASSWORD\"}"]
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ai-network

  db-init:
    image: ccr.ccs.tencentyun.com/buildingai/postgres:17.6
    container_name: ai-db-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      TZ: Asia/Shanghai
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        DB_NAME="${DB_DATABASE:-api_platform_pro}"
        DB_USER="${DB_USERNAME:-postgres}"
        DB_HOST="postgres"
        
        echo "Checking if database exists: $DB_NAME"
        
        RESULT=$(psql -h $DB_HOST -U $DB_USER -tc "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME'")
        
        if [ -z "$RESULT" ]; then
          echo "Database $DB_NAME does not exist, creating..."
          createdb -h $DB_HOST -U $DB_USER -E UTF8 -T template0 "$DB_NAME"
          echo "Database $DB_NAME created successfully."
        else
          echo "Database $DB_NAME already exists."
        fi
    networks:
      - ai-network

  app:
    image: node:22.22-alpine3.23
    container_name: ai-app
    restart:  on-failure:5
    working_dir: /app
    volumes:
            - app_data:/app
            - /app/node_modules
            - /app/packages/cli/node_modules
            - /app/packages/core/node_modules
            - /app/packages/client/node_modules
            - /app/packages/web/@buildingai/designer/node_modules
            - /app/packages/web/@buildingai/hooks/node_modules
            - /app/packages/web/@buildingai/http/node_modules
            - /app/packages/web/@buildingai/i18n-config/node_modules
            - /app/packages/web/@buildingai/layouts/node_modules
            - /app/packages/web/@buildingai/nuxt/node_modules
            - /app/packages/web/@buildingai/service/node_modules
            - /app/packages/web/@buildingai/stores/node_modules
            - /app/packages/web/@buildingai/ui/node_modules
            - /app/packages/web/@buildingai/web-config/node_modules
            - /app/packages/@buildingai/ai-sdk/node_modules
            - /app/packages/@buildingai/base/node_modules
            - /app/packages/@buildingai/cache/node_modules
            - /app/packages/@buildingai/config/node_modules
            - /app/packages/@buildingai/constants/node_modules
            - /app/packages/@buildingai/db/node_modules
            - /app/packages/@buildingai/decorators/node_modules
            - /app/packages/@buildingai/dict/node_modules
            - /app/packages/@buildingai/di/node_modules
            - /app/packages/@buildingai/dto/node_modules
            - /app/packages/@buildingai/errors/node_modules
            - /app/packages/@buildingai/eslint-config/node_modules
            - /app/packages/@buildingai/extension-sdk/node_modules
            - /app/packages/@buildingai/logger/node_modules
            - /app/packages/@buildingai/pipe/node_modules
            - /app/packages/@buildingai/types/node_modules
            - /app/packages/@buildingai/typescript-config/node_modules
            - /app/packages/@buildingai/upgrade/node_modules
            - /app/packages/@buildingai/utils/node_modules
            - /app/packages/@buildingai/wechat-sdk/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      SERVER_PORT: 8080
      APP_DOMAIN: ${APP_DOMAIN:-}

      JWT_SECRET: ${JWT_SECRET:-unicloud_ai_system}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}

      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-api_platform_pro}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
      DB_DEV_SYNCHRONIZE: ${DB_DEV_SYNCHRONIZE:-false}
      DB_LOGGING: ${DB_LOGGING:-false}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}

      VITE_APP_WEB_API_PREFIX: ${VITE_APP_WEB_API_PREFIX:-/api}
      VITE_APP_CONSOLE_API_PREFIX: ${VITE_APP_CONSOLE_API_PREFIX:-/consoleapi}
      VITE_PRODUCTION_APP_BASE_URL: ${VITE_PRODUCTION_APP_BASE_URL:-}

      LOG_LEVELS: ${LOG_LEVELS:-error,warn,debug,fatal}
      LOG_TO_FILE: ${LOG_TO_FILE:-true}
      LOG_WRITE_LEVELS: ${LOG_WRITE_LEVELS:-error,warn,debug,fatal,log}
      LOG_DATABASE_SCHEMA: ${LOG_DATABASE_SCHEMA:-false}
      LOG_CLEAN_INTERVAL: ${LOG_CLEAN_INTERVAL:-3}

      CACHE_TTL: ${CACHE_TTL:-86400}
      CACHE_MAX_ITEMS: ${CACHE_MAX_ITEMS:-1000}

      SERVER_CORS_ENABLED: ${SERVER_CORS_ENABLED:-true}
      SERVER_CORS_ORIGIN: ${SERVER_CORS_ORIGIN:-*}
      SERVER_SHOW_DETAILED_ERRORS: ${SERVER_SHOW_DETAILED_ERRORS:-false}
      SERVER_IS_DEMO_ENV: ${SERVER_IS_DEMO_ENV:-false}
    ports:
      - "${APP_EXTERNAL_PORT:-8080}:8080"
    volumes:
      - app_data:/app
      - app_storage:/app/storage
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/consoleapi/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    command: |
            sh -c '
            set -e
            echo "🚀 Starting app container..."

            if [ -n "$NPM_REGISTRY_URL" ]; then
            echo "🔧 Using custom registry: $NPM_REGISTRY_URL"
            if command -v npm >/dev/null 2>&1; then
                npm config set registry "$NPM_REGISTRY_URL"
            fi
            if command -v pnpm >/dev/null 2>&1; then
                pnpm config set registry "$NPM_REGISTRY_URL"
            fi
            else
            echo "⚠️ NPM_REGISTRY_URL not set, using default registry"
            fi

            if ! command -v pnpm >/dev/null 2>&1; then
            echo "📦 Installing pnpm..."
            npm install -g pnpm
            npm install -g pm2

            if [ -n "$NPM_REGISTRY_URL" ]; then
                pnpm config set registry "$NPM_REGISTRY_URL"
            fi
            fi

            echo "🎯 Starting app..."
            exec pnpm start --no-daemon
            '
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge


volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/workspace/data1/web/pgdata
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/workspace/data1/web/redisdata
  app_storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/workspace/data1/web/storage
  app_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/workspace/data1/web/logs
  app:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/workspace/data1/web/app
